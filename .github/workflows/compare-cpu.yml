name: Compare CPU regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/aidd-four-model-compare]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compare-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOXNET_MULTITASK_ENABLE: 'false'
      AIDD_TXGEMMA_ENABLE: 'false'
      AIDD_TXGEMMA_LICENSE_ACCEPTED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified official v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified official v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified official v4
        with:
          node-version: '22'
      - name: Install CPU dependencies, never model weights
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-model.txt -r requirements-v3.txt -r requirements-dev.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Verify source checkout and scientific boundaries
        run: |
          python -c "import torch; from pathlib import Path; print('CUDA:', torch.cuda.is_available()); print('Pretrained weights downloaded:', Path('models/pretrained/molformer').exists()); print('This job tests CPU software, real existing v2 artifacts where applicable, and explicit provider/encoder fixtures; no paid APIs or large-model deployments.')"
          git diff --exit-code -- models/aidd-toxnet artifacts/external-herg-evaluation.json artifacts/external-herg-evaluation-predictions.json
      - name: Python contracts, SQLite, cancellation, security and v2 regression
        run: python -m unittest discover -s test -p 'test_*.py' -v
      - name: JavaScript state and stable DOM tests
        run: npm test
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check toxicity-core.js
          node --check compare-app.js
          node --check compare-core.js
      - name: Recheck immutable scientific artifacts after all tests
        run: |
          python scripts/verify_compare_preservation.py
          git diff --exit-code -- models/aidd-toxnet artifacts
